services:
  ollama:
    image: ollama/ollama:latest
    container_name: search-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_models:/root/.ollama
    networks:
      - search-network
    restart: unless-stopped

  search-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: search-engine
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OLLAMA_HOST=http://ollama:11434
      - DATASET_PATH=/data/dataset
    volumes:
      - ./data/dataset:/data/dataset:ro
      - ./static:/app/static:ro
    depends_on:
      - ollama
    networks:
      - search-network
    restart: unless-stopped

networks:
  search-network:
    driver: bridge
